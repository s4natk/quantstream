name: deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Push image
        id: image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecr describe-repositories --repository-names quantstream >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name quantstream >/dev/null
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          image="$registry/quantstream:${GITHUB_SHA}"
          docker build -t "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Update stack
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FEED_URL: ${{ secrets.FEED_URL }}
        run: |
          aws cloudformation deploy \
            --stack-name quantstream \
            --template-file deploy/stack.yml \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              ImageUri="$IMAGE_URI" \
              DbPassword="$DB_PASSWORD" \
              FeedUrl="$FEED_URL"
