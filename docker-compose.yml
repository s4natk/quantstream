x-app: &app
  build: .
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql+asyncpg://quantstream:quantstream@postgres:5432/quantstream
    REDIS_URL: redis://redis:6379/0
    STREAM_KEY: ticks
    FEED_URL: ws://localhost:8765/trades
    ARCHIVE_DIR: /archives

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantstream
      POSTGRES_PASSWORD: quantstream
      POSTGRES_DB: quantstream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantstream -d quantstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    <<: *app
    command: ["python", "-m", "quantstream.ingest"]

  worker:
    <<: *app
    command: ["python", "-m", "quantstream.worker"]

  api:
    <<: *app
    command: ["python", "-m", "quantstream.api"]
    ports:
      - "8000:8000"

  archiver:
    <<: *app
    command: ["python", "-m", "quantstream.archiver"]
    volumes:
      - archives:/archives

volumes:
  pgdata:
  archives:
