[project]
name = "quantstream"
version = "0.1.0"
description = "Live trade feed into rolling OHLC candles and volatility alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
quantstream-ingest = "quantstream.ingest:main"
quantstream-worker = "quantstream.worker:main"
quantstream-api = "quantstream.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
